# Production game server. Reached only through Caddy (TLS) on the host.
name: calindra-strike

services:
  game:
    build: .
    image: calindra-strike-server:latest
    container_name: calindra-strike
    restart: unless-stopped
    ports:
      - "127.0.0.1:7350:7350" # loopback only: never published on the public interface
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS in .env}
      TRUST_PROXY: "1"
      MAX_PLAYERS: ${MAX_PLAYERS:-24}
      MAX_PER_IP: ${MAX_PER_IP:-32}
      MATCH_SECONDS: ${MATCH_SECONDS:-300}
      PODIUM_SECONDS: ${PODIUM_SECONDS:-15}
      WARMUP_MIN_PLAYERS: ${WARMUP_MIN_PLAYERS:-2}
      GAME_MODES: ${GAME_MODES:-tdm,ffa,ctf,defuse,almoco}
      GAME_MAPS: ${GAME_MAPS:-}
      CTF_CAPTURE_LIMIT: ${CTF_CAPTURE_LIMIT:-3}
      DEFUSE_SCORE_LIMIT: ${DEFUSE_SCORE_LIMIT:-5}
      DEFUSE_PLANT_TIMEOUT: ${DEFUSE_PLANT_TIMEOUT:-1}
      DEFUSE_PLANT_TIMEOUT_SECONDS: ${DEFUSE_PLANT_TIMEOUT_SECONDS:-60}
      RESPAWN_OBJECTIVE_SECONDS: ${RESPAWN_OBJECTIVE_SECONDS:-12}
      FRIENDLY_FIRE: ${FRIENDLY_FIRE:-0}
      READY_KICK: ${READY_KICK:-1}
      READY_KICK_SECONDS: ${READY_KICK_SECONDS:-180}
      IDLE_KICK: ${IDLE_KICK:-1}
      IDLE_KICK_SECONDS: ${IDLE_KICK_SECONDS:-60}
      IDLE_KICK_WARMUP_SECONDS: ${IDLE_KICK_WARMUP_SECONDS:-300}
      RADIO_COOLDOWN_SECONDS: ${RADIO_COOLDOWN_SECONDS:-1.5}
      RADIO_MAX_PER_WINDOW: ${RADIO_MAX_PER_WINDOW:-3}
      RADIO_WINDOW_SECONDS: ${RADIO_WINDOW_SECONDS:-10}
      TDM_SCORE_LIMIT: ${TDM_SCORE_LIMIT:-50}
      AIRDROP_FIRST_SECONDS: ${AIRDROP_FIRST_SECONDS:-25}
      BOT_FILL: ${BOT_FILL:-0}
      BOT_SKILL: ${BOT_SKILL:-45}
      JOIN_CODE: ${JOIN_CODE:-}
    stop_grace_period: 5s # SIGTERM: the server tells clients to reconnect, then exits
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 384m
    cpus: 1.5
    ulimits:
      nofile: { soft: 4096, hard: 4096 }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [game]

networks:
  game: {}
